[package]
name = "puzzle-utils"
version = "0.3.0"
authors = ["J164"]
rust-version = "1.100.0"
edition = "2024"
license = "MIT"
description = "Puzzle solving utilities"
repository = "https://github.com/J164/puzzle-utils"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lints.clippy]
unwrap_used = "warn"

[[bin]]
  name = "puzzle-utils"
  path = "src/bin/puzzle-utils/main.rs"
  required-features = ["cli"]

[features]
default = ["sudoku", "nonogram", "maze", "render"]
cli = ["sudoku", "nonogram", "maze", "render", "dep:clap"]
sudoku = []
nonogram = []
maze = ["dep:rand", "dep:serde"]
render = ["dep:image", "dep:imageproc", "dep:ab_glyph"]

[dependencies]
ab_glyph = { version = "0.2.32", optional = true }
clap = { version = "4.6.7", default-features = false, optional = true }
image = { version = "0.25.10", optional = true, default-features = false, features = ["png"] }
imageproc = { version = "0.27.0", optional = true, default-features = false, features = ["text"] }
rand = { version = "0.10.3", optional = true, default-features = false, features = ["std", "thread_rng"] }
serde = { version = "1.0.229", optional = true, features = ["derive"] }
thiserror = "2.0.21"
